<style>

<style>
/* Layout: a forge-lit smithy. An oval oak table banded in riveted iron fills the middle; opponents sit on its rim, you sit at the near edge, and your hand rests on the workbench below. One dark world, deliberately single-theme. */
:root {
  --soot: #120e0c;
  --stone: #241c17;
  --oak: #6b4527;
  --oak-dark: #3c2513;
  --iron: #2e3034;
  --iron-hi: #70757c;
  --ember: #ff8a2a;
  --ember-hot: #ffc067;
  --parch: #f1e4cc;
  --parch-dim: rgba(241, 228, 204, .72);
  --line: rgba(241, 228, 204, .14);
  --ink: #1d1410;
  --brass: #e2b25a;
  --bad: #f2a08a;
  --good: #9fe0b4;
  --f-mark: "Pirata One", "UnifrakturCook", Georgia, serif;
  --f-display: "Marcellus SC", "Trajan Pro", Georgia, serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --card-w: clamp(54px, 12.5vw, 82px);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--soot);
  background-image:
    radial-gradient(ellipse 80% 38% at 50% 100%, rgba(255, 106, 24, .30), transparent 70%),
    radial-gradient(ellipse 70% 50% at 50% 34%, rgba(78, 58, 46, .55), transparent 75%),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 2px, transparent 2px 52px),
    linear-gradient(180deg, var(--stone), var(--soot));
  color: var(--parch);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.4;
}
.wrap {
  position: relative; z-index: 1;
  max-width: 1500px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 12px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .card:focus-visible { outline: 3px solid var(--ember-hot); outline-offset: 3px; }

/* forged buttons */
.btn {
  border: 1.5px solid var(--iron-hi); border-radius: 10px;
  background: linear-gradient(180deg, #3d4046, #25272b);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 3px 8px rgba(0, 0, 0, .45);
  padding: 9px 18px; font-weight: 700; letter-spacing: .02em; min-height: 44px;
}
.btn:hover:not(:disabled) { border-color: var(--parch-dim); }
.btn.primary {
  background: linear-gradient(180deg, #ffbd6b, #e46a17); border-color: #ffd49a; color: #2a1406;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 0 18px rgba(255, 138, 42, .35), 0 3px 8px rgba(0, 0, 0, .45);
}
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ffcb85, #f07a22); }
.btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
.btn.small { padding: 5px 14px; min-height: 34px; font-size: 14px; }

/* header */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mark { font-family: var(--f-mark); font-size: 38px; line-height: 1; display: flex; align-items: center; gap: 8px;
  color: var(--parch); text-shadow: 0 0 14px rgba(255, 138, 42, .45); }
.mark svg { width: 26px; height: 26px; color: var(--ember-hot); }
.meta { color: var(--parch-dim); font-size: 14px; font-variant-numeric: tabular-nums; }
.hdr-btns { display: flex; gap: 8px; }

/* cards */
.card {
  position: relative; width: var(--card-w); aspect-ratio: 5 / 7; border-radius: 7%/5%;
  background: var(--parch); box-shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 6px 14px rgba(0, 0, 0, .35);
  flex: none; border: 0; padding: 0; overflow: hidden; display: block;
}
.card img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
.card .star {
  position: absolute; right: 6%; top: 38%; width: 26%; aspect-ratio: 1; border-radius: 50%;
  background: var(--brass); color: var(--ink); display: grid; place-items: center;
  font-size: calc(var(--w, var(--card-w)) * .17); line-height: 1; box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
}
.card .new {
  position: absolute; right: 5%; top: 3%;
  background: var(--ember-hot); color: var(--ink); font-size: 10px; font-weight: 800; letter-spacing: .08em;
  padding: 1px 6px; border-radius: 4px; text-transform: uppercase;
}
.card.mini { --w: 34px; width: var(--w); border-radius: 3px; box-shadow: 0 1px 3px rgba(0, 0, 0, .45); }
.card.mini .star { font-size: 7px; }
.card.tiny { --w: 11px; width: var(--w); border-radius: 2px; box-shadow: none; }
.card.big { --w: clamp(96px, 26vw, 136px); width: var(--w); }
.card .negmark {
  position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%);
  background: var(--ink); color: var(--parch); font-weight: 800; line-height: 1;
  font-size: calc(var(--w, var(--card-w)) * .2); padding: .18em .4em; border-radius: .3em;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.card.mini .negmark { font-size: 9px; padding: 1px 3px; }
.card .fivemark {
  position: absolute; left: 50%; bottom: calc(4% + var(--w, var(--card-w)) * .3); transform: translateX(-50%);
  background: var(--bad); color: var(--ink); font-weight: 800; line-height: 1; white-space: nowrap;
  font-size: calc(var(--w, var(--card-w)) * .15); padding: .2em .45em; border-radius: .3em;
}
.card .fivemark.paired { background: var(--good); }
.tag { white-space: nowrap; flex: none; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: rgba(0, 0, 0, .45); color: var(--parch-dim); }
.tag.win { background: var(--ember-hot); color: var(--ink); }
.tag.drew { color: var(--bad); }
.tag.dim { background: transparent; font-weight: 500; font-style: italic; }

/* the table */
.wrap.fit { height: 100%; min-height: 0; padding-block: 8px 10px; gap: 8px; }
.stage-box { position: relative; flex: 1 1 0; min-height: 220px; container-type: size; display: grid; place-items: center; }

/* showdown: everyone's play, large, the moment cards flip */
.showdown {
  --cols: 2; --rows: 2;
  --sdw: min(calc(((97cqw - 28px - (var(--cols) - 1) * 12px) / var(--cols) - 28px) / var(--div, 3.3)), calc(((96cqh - 64px - (var(--rows) - 1) * 12px - 18px) / var(--rows) - 52px) / 1.4), 180px);
  position: absolute; inset: 2% 1.5%; z-index: 5; display: flex; flex-direction: column; gap: 8px; padding: 10px 14px 14px; border-radius: 22px;
  background: radial-gradient(ellipse 70% 60% at 50% 45%, rgb(62, 36, 19), rgb(16, 10, 7));
  border: 1px solid rgba(255, 190, 110, .25); box-shadow: 0 20px 50px rgba(0, 0, 0, .6), inset 0 0 60px rgba(255, 120, 40, .1);
  animation: rise .25s ease-out both;
}
.sd-head { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; }
.sd-head .card { --w: 30px; width: var(--w); border-radius: 3px; }
.sd-title { font-family: var(--f-display); font-size: clamp(18px, 2.4vw, 24px); letter-spacing: .06em; }
.sd-title b { color: var(--ember-hot); font-weight: 400; text-shadow: 0 0 10px rgba(255, 138, 42, .6); }
.sd-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); gap: 12px; padding-top: 18px; }
.sd-tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; min-width: 0; min-height: 0;
  border-radius: 14px; background: rgba(255, 255, 255, .045); border: 1px solid var(--line); }
.sd-label { display: flex; align-items: baseline; gap: 8px; max-width: 100%; white-space: nowrap; }
.sd-name { font-family: var(--f-display); font-size: clamp(14px, 1.8vw, 18px); overflow: hidden; text-overflow: ellipsis; }
.sd-cap { font-size: 12.5px; color: var(--parch-dim); }
.sd-tile .cards { display: flex; gap: 6px; justify-content: center; }
.sd-tile .card { --w: var(--sdw); width: var(--sdw); }
.sd-pass { font-family: var(--f-display); font-size: clamp(15px, 2vw, 20px); color: var(--parch-dim); padding: 6px 0; }
.sd-tile.passed { opacity: .5; }
.showdown.tight { --div: 2.4; }
.showdown.tight .sd-tile .card + .card { margin-left: calc(var(--sdw) * -.35 - 6px); }
.sd-tile.win { padding-top: 22px; }
.sd-tile.win {
  border: 2px solid var(--ember-hot);
  background: radial-gradient(ellipse at 50% 0%, rgba(255, 170, 70, .32), rgba(255, 138, 42, .07) 70%);
  box-shadow: 0 0 0 3px rgba(255, 138, 42, .25), 0 0 44px rgba(255, 138, 42, .5);
  animation: winglow 1.4s ease-in-out .7s 2;
}
.sd-tile.win .sd-name { color: var(--ember-hot); }
.sd-crown {
  position: absolute; top: -17px; left: 50%; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 3px 14px 3px 9px; border-radius: 999px;
  background: linear-gradient(180deg, #ffd884, #e8891a); color: #2a1406; font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .55), 0 0 22px rgba(255, 170, 60, .65);
  transform: translateX(-50%); animation: crown-pop .5s cubic-bezier(.2, 1.6, .4, 1) .55s both;
}
.sd-crown svg { width: 22px; height: 17px; }
.sd-crown.sd-quench { background: linear-gradient(180deg, #a8e3f5, #2e86ab); color: #0b2633; box-shadow: 0 4px 14px rgba(0, 0, 0, .55), 0 0 22px rgba(80, 180, 230, .6); }
.sd-tile.quench { border: 2px solid #5fb8dc; background: radial-gradient(ellipse at 50% 0%, rgba(120, 200, 240, .22), rgba(46, 134, 171, .06) 70%); box-shadow: 0 0 30px rgba(80, 180, 230, .35); padding-top: 22px; }
.sd-tile.quench .sd-name { color: #a8e3f5; }
@keyframes crown-pop { from { transform: translateX(-50%) scale(0) rotate(-14deg); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
@keyframes winglow { 50% { box-shadow: 0 0 0 5px rgba(255, 138, 42, .35), 0 0 70px rgba(255, 150, 50, .75); } }
@media (prefers-reduced-motion: reduce) { .showdown, .sd-crown, .sd-tile.win { animation: none; } }
.stage { --sw: clamp(80px, 12vw, 156px); position: relative; width: min(100cqw, 100cqh * 2.05); height: min(100cqh, 100cqw / 2.05); }
.board {
  position: absolute; inset: 13% 8.5%; border-radius: 50%;
  background:
    radial-gradient(ellipse 58% 52% at 50% 50%, rgba(255, 150, 70, .13), transparent 72%),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .45) 0 2px, transparent 2px 12.5%),
    repeating-linear-gradient(91deg, rgba(255, 235, 200, .035) 0 1px, transparent 1px 5px, rgba(0, 0, 0, .06) 5px 6px, transparent 6px 11px),
    linear-gradient(180deg, var(--oak) 0%, var(--oak-dark) 100%);
  box-shadow:
    inset 0 0 0 2px rgba(0, 0, 0, .6),
    inset 0 16px 40px rgba(0, 0, 0, .55),
    inset 0 -12px 30px rgba(255, 140, 60, .12),
    0 0 0 9px #26282c,
    0 0 0 11px #5b6067,
    0 0 0 14px #18191c,
    0 24px 50px rgba(0, 0, 0, .7),
    0 0 100px rgba(255, 120, 40, .18);
}
.rivet {
  position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #d3d8de, #5a5f66 55%, #1d1f22);
  box-shadow: 0 1px 1px rgba(0, 0, 0, .6);
}
.mat {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1;
  display: grid; grid-template-columns: auto auto auto; grid-template-areas: "draw tcol disc";
  align-items: center; gap: clamp(10px, 2vw, 22px);
  padding: clamp(10px, 1.6vw, 18px) clamp(12px, 2vw, 24px); border-radius: 18px;
  background: radial-gradient(ellipse at 50% 35%, #3d2619, #22140c);
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .55), 0 8px 20px rgba(0, 0, 0, .5);
  outline: 1.5px dashed rgba(241, 228, 204, .22); outline-offset: -7px;
}
.mat .draw { grid-area: draw; } .mat .tcol { grid-area: tcol; } .mat .disc { grid-area: disc; }
.mat .card.big { --w: clamp(56px, min(14vw, 30cqh), 200px); }
@media (min-width: 641px) { .mat .tcol { flex-direction: row; gap: 14px; } .mat .tcol .plate { margin-top: 0; padding: 8px 14px; } .mat .tcol .pl-row { flex-direction: column; align-items: center; gap: 2px; } .mat .tcol .pl-n { font-size: clamp(30px, 4.2vw, 52px); } }
.pile { --w: clamp(28px, min(6vw, 13cqh), 80px); display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; color: var(--parch-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pile .card, .pile .empty-slot { --w: inherit; width: var(--w); }
.pile .stack { position: relative; isolation: isolate; }
.pile .stack::before, .pile .stack::after { content: ""; position: absolute; inset: 0; border-radius: 7%/5%; background: #2a1b12; border: 1px solid var(--line); }
.pile .stack::before { transform: translate(2px, 2px); z-index: -1; }
.pile .stack::after { transform: translate(4px, 4px); z-index: -2; }
.empty-slot { display: block; width: var(--w, 60px); aspect-ratio: 5/7; border: 1.5px dashed var(--line); border-radius: 7%/5%; }
.tcol { display: flex; flex-direction: column; align-items: center; }
.plate {
  margin-top: 8px; display: flex; flex-direction: column; align-items: center; padding: 3px 12px 5px; border-radius: 8px;
  background: linear-gradient(180deg, #4a4e54, #26282c); border: 1px solid var(--iron-hi);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 3px 8px rgba(0, 0, 0, .5); line-height: 1.05;
}
.pl-row { display: flex; align-items: baseline; gap: 6px; }
.pl-l { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--parch-dim); font-weight: 700; }
.pl-n { font-family: var(--f-display); font-size: clamp(22px, 3.4vw, 34px); color: var(--ember-hot); text-shadow: 0 0 10px rgba(255, 138, 42, .6); font-variant-numeric: tabular-nums; }
.pl-s { font-size: 11px; color: var(--parch-dim); white-space: nowrap; }
.card.preview { box-shadow: 0 0 0 3px var(--ember-hot), 0 0 24px rgba(255, 138, 42, .55); }

/* seats on the rim */
.seat {
  position: absolute; z-index: 2; transform: translate(-50%, -50%); width: var(--sw);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.seat.below { flex-direction: column-reverse; }
.plaque {
  width: 100%; padding: 5px 8px 6px; border-radius: 10px; text-align: center;
  background: linear-gradient(180deg, #3d4046, #232529); border: 1px solid #5d6269;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 4px 10px rgba(0, 0, 0, .55);
  transition: border-color .25s, box-shadow .25s, background .25s;
}
.seat.me .plaque { border-color: var(--brass); }
.plaque .nm { font-family: var(--f-display); font-size: clamp(15px, 1.25vw, 19px); letter-spacing: .04em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plaque .sub { font-size: 11.5px; color: var(--parch-dim); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 5px; font-variant-numeric: tabular-nums; }
.seat.low .plaque {
  position: relative; border-color: #ff6a2a;
  background: linear-gradient(180deg, #5a2a17, #2a1610);
  animation: heat 1.6s ease-in-out infinite;
}
.seat.last .plaque { animation-duration: .9s; border-color: #ffb04a; }
@keyframes heat {
  0%, 100% { box-shadow: 0 0 0 1px rgba(255, 106, 42, .35), 0 0 12px rgba(255, 90, 30, .35), inset 0 1px 0 rgba(255, 255, 255, .12); }
  50% { box-shadow: 0 0 0 3px rgba(255, 120, 40, .55), 0 0 30px rgba(255, 110, 30, .75), inset 0 1px 0 rgba(255, 255, 255, .12); }
}
.low-badge {
  position: absolute; top: -11px; right: -8px; z-index: 1; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  background: linear-gradient(180deg, #ff8a3d, #d9480f); color: #fff6e8; font-size: 11.5px; font-weight: 800; letter-spacing: .04em;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .5), 0 0 12px rgba(255, 110, 30, .6);
}
.low-badge.last { background: linear-gradient(180deg, #ffe08a, #ff8a1a); color: #2a1406; text-transform: uppercase; letter-spacing: .08em; }
@media (prefers-reduced-motion: reduce) { .seat.low .plaque { animation: none; box-shadow: 0 0 0 2px rgba(255, 120, 40, .6), 0 0 20px rgba(255, 110, 30, .6); } }
.seat.win .plaque {
  border-color: var(--ember); background: linear-gradient(180deg, #6a3f22, #2e1d13);
  box-shadow: 0 0 0 2px rgba(255, 138, 42, .35), 0 0 26px rgba(255, 138, 42, .55), inset 0 1px 0 rgba(255, 255, 255, .15);
}
.seat .played { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.seat .cards { display: flex; gap: 3px; justify-content: center; }
.seat .card.mini { --w: clamp(19px, min(3vw, 6.5cqh), 42px); }

.herald { flex: none; margin: 0 auto; text-align: center; font-size: 16px; min-height: 24px; max-width: 62ch; text-wrap: balance; }
.herald b { color: var(--ember-hot); }

/* workbench: your hand */
.you {
  flex: none; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 12px; border-radius: 16px;
  background: linear-gradient(180deg, #2c241f, #1a1512); border: 1px solid #4a4e54;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 10px 30px rgba(0, 0, 0, .45);
}
.you.picking { border-color: var(--ember); }
.you-top { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
.you-top .meter { flex: 1 1 260px; min-width: 0; }
.seat-name { font-weight: 800; font-size: 16px; }
.meter { font-size: 15px; font-variant-numeric: tabular-nums; min-height: 22px; }
.meter .ok { color: var(--good); font-weight: 700; }
.meter .no { color: var(--bad); }
.hand { --hw: clamp(46px, min(12vw, 12.5dvh), 104px); display: flex; flex-wrap: nowrap; justify-content: center; padding-top: 12px; }
.hand { --cw: max(46px, min(var(--hw), calc((100% - (var(--n) - 1) * 8px) / var(--n)))); }
.hand .card { --w: var(--hw); width: var(--cw); }
.hand .card + .card { margin-left: min(8px, calc((100% - var(--n) * var(--cw)) / (var(--n) - 1))); }
.hand .card { transition: transform .15s ease, box-shadow .15s ease, opacity .2s; }
@media (hover: hover) { .hand .card:hover:not(:disabled):not(.sel) { transform: translateY(-4px); } }
.hand .card.sel { transform: translateY(-12px); outline: 3px solid var(--ember-hot); outline-offset: -1px; box-shadow: 0 0 18px rgba(255, 138, 42, .5); }
.hand .card.dim { opacity: .45; }
.hand .card.pickable { box-shadow: 0 0 0 2px var(--parch), 0 6px 14px rgba(0, 0, 0, .35); }
.hand .card:disabled { cursor: default; }
.pickbar { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 12px; background: rgba(255, 138, 42, .12); border: 1.5px solid var(--ember); }
.pick-title { font-family: var(--f-display); font-size: 22px; color: var(--ember-hot); line-height: 1.15; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--parch-dim); font-weight: 700; }
.hint { color: var(--parch-dim); font-size: 14px; }

/* overlays */
.sheet-bg { position: fixed; inset: 0; background: rgba(8, 5, 3, .74); display: grid; place-items: center; z-index: 10;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: linear-gradient(180deg, #2a221d, #19140f); border: 1px solid var(--iron-hi); border-radius: 16px; width: min(640px, 100%);
  max-height: 100%; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 60px rgba(255, 120, 40, .12); }
.sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: .03em; text-wrap: balance; }
.sheet h3 { margin: 6px 0 0; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--parch-dim); }
.sheet p, .sheet li { max-width: 65ch; }
.sheet ol, .sheet ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid #5d6269; background: linear-gradient(180deg, #34373c, #222428); border-radius: 10px; min-width: 44px; min-height: 44px; padding: 0 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: linear-gradient(180deg, #ffbd6b, #e46a17); color: #2a1406; border-color: #ffd49a; }

/* splash */
.splash { overflow-x: clip; overflow-y: visible; display: flex; flex-direction: column; gap: 22px; padding-block: 16px 24px; max-width: 1100px; width: 100%; margin: 0 auto; }
.splash-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 24px; align-items: center; }
.splash-top > div:first-child { display: flex; flex-direction: column; gap: 12px; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.panel.mode { gap: 14px; }
.panel.friends { border-color: rgba(255, 150, 60, .45); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 10px 30px rgba(0, 0, 0, .4), 0 0 40px rgba(255, 120, 40, .12); }
.name-row { display: flex; flex-direction: column; gap: 6px; }
.join-row { border-top: 1px solid var(--line); padding-top: 12px; }
.invite { margin: 0; font-size: 16px; }
.invite b { color: var(--ember-hot); letter-spacing: .12em; }
.btn.big { min-height: 52px; padding: 12px 28px; font-size: 18px; }
.lobby-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.lobby-grid .code-panel { grid-row: span 2; }
.deal-row { border-top: 1px solid var(--line); padding-top: 14px; width: 100%; }
.pl.open .pl-name { color: var(--parch-dim); font-weight: 500; font-style: italic; }
.sheet.connecting { width: min(420px, 100%); align-items: center; text-align: center; }
.anvil { display: flex; gap: 8px; height: 22px; align-items: flex-end; }
.anvil span { width: 10px; height: 10px; border-radius: 50%; background: var(--ember-hot); box-shadow: 0 0 10px rgba(255, 138, 42, .8); animation: spark-hop 1s ease-in-out infinite; }
.anvil span:nth-child(2) { animation-delay: .15s; } .anvil span:nth-child(3) { animation-delay: .3s; }
@keyframes spark-hop { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-10px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .anvil span { animation: none; opacity: .9; } }
@media (max-width: 860px) { .modes, .lobby-grid { grid-template-columns: minmax(0, 1fr); } .lobby-grid .code-panel { grid-row: auto; } }
.splash h1 { font-family: var(--f-mark); font-weight: 400; font-size: clamp(72px, 15vw, 132px); line-height: .85; margin: 0; text-shadow: 0 0 30px rgba(255, 138, 42, .45); }
.splash .lead { font-size: 18px; max-width: 40ch; color: var(--parch-dim); margin: 0; }
.fan { --spread: 68px; --fw: 112px; position: relative; isolation: isolate; width: 480px; max-width: 100%; height: 260px; overflow: visible; }
.fan::before {
  content: ""; position: absolute; left: 4%; right: 4%; top: 46%; height: 56%; border-radius: 50%; z-index: -1;
  background: repeating-linear-gradient(90deg, rgba(0, 0, 0, .45) 0 2px, transparent 2px 12.5%), linear-gradient(180deg, var(--oak), var(--oak-dark));
  box-shadow: 0 0 0 7px #26282c, 0 0 0 9px #5b6067, 0 0 0 11px #18191c, 0 18px 40px rgba(0, 0, 0, .6), 0 0 70px rgba(255, 120, 40, .2);
}
.fan .card { position: absolute; left: 50%; top: 10px; width: var(--fw); --w: var(--fw); margin-left: calc(var(--fw) / -2); transform-origin: 50% 160%; }
@media (max-width: 560px) { .fan { --spread: 44px; --fw: 80px; height: 200px; width: 100%; } }
@media (max-width: 380px) { .fan { --spread: 38px; --fw: 66px; height: 180px; } }
.setup { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label, .field .lbl { font-weight: 700; }

/* scores */
.scores { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.scores th, .scores td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.scores th { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--parch-dim); font-weight: 700; }
.scores td.num, .scores th.num { text-align: right; }
.scores tr.lead td { color: var(--ember-hot); }
.breakdown { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.pts { font-size: 11px; color: var(--parch-dim); display: block; text-align: center; }
.pts.paired { color: var(--good); }
.pts.unpaired { color: var(--bad); }
.cell-card { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.chip { position: relative; display: grid; place-items: center; min-width: 40px; height: 44px; padding: 0 6px; border-radius: 8px; border: 2px solid;
  color: #fff; font-family: var(--f-display); font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 2px 6px rgba(0, 0, 0, .4); }
.chip.neg { background: #1d1410; text-shadow: none; }
.chip i { position: absolute; top: -6px; right: -6px; font-style: normal; font-size: 11px; width: 17px; height: 17px; display: grid; place-items: center; border-radius: 50%; background: var(--brass); color: var(--ink); text-shadow: none; }
.breakdown { gap: 6px !important; }
.pts { font-size: 12px !important; font-weight: 700; }
@media (max-width: 640px) { .chip { min-width: 30px; height: 34px; font-size: 17px; padding: 0 4px; border-radius: 6px; } .breakdown { gap: 4px !important; } .scores th, .scores td { padding: 6px 4px; } }
.tbl-wrap { overflow-x: auto; }

/* online: start screen fields and lobby */
.inp { font: inherit; color: var(--parch); background: #1b1512; border: 1.5px solid #5d6269; border-radius: 10px; min-height: 44px; padding: 8px 12px; min-width: 0; }
.inp:focus-visible { outline: 3px solid var(--ember-hot); outline-offset: 2px; }
.inp::placeholder { color: rgba(241, 228, 204, .4); }
#o-name { max-width: 280px; }
.inp.code { width: 6.2em; text-transform: uppercase; letter-spacing: .2em; font-weight: 700; text-align: center; }
.or { color: var(--parch-dim); font-size: 14px; }
.field.online { border-top: 1px solid var(--line); padding-top: 16px; }
.hint.bad { color: var(--bad); }
.lobby { max-width: 1000px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-block: 8px 24px; }
.panel { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 16px;
  background: linear-gradient(180deg, #2c241f, #1a1512); border: 1px solid #4a4e54; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 10px 30px rgba(0, 0, 0, .4); }
.code-panel { align-items: flex-start; }
.code-big { font-family: var(--f-display); font-size: clamp(44px, 12vw, 64px); line-height: 1; letter-spacing: .18em; color: var(--ember-hot); text-shadow: 0 0 18px rgba(255, 138, 42, .45); }
.sel-text { user-select: all; color: var(--parch); overflow-wrap: anywhere; }
.ph { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; display: flex; align-items: baseline; gap: 10px; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pl { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); min-height: 48px; }
.pl:last-child { border-bottom: 0; }
.pl-name { font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.pl.me .pl-name { color: var(--ember-hot); }
.seg button:disabled { opacity: .55; cursor: default; }

/* sparks rising from the forge */
.sparks { position: fixed; left: 0; right: 0; bottom: 0; height: 70vh; pointer-events: none; overflow: hidden; z-index: 0; }
.sparks i { position: absolute; bottom: -8px; width: 3px; height: 3px; border-radius: 50%; background: var(--ember-hot);
  box-shadow: 0 0 6px 2px rgba(255, 138, 42, .7); opacity: 0; animation: spark var(--d) linear var(--dl) infinite; }
@keyframes spark { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: .9; } 100% { transform: translate(var(--dx), -70vh); opacity: 0; } }

/* reveal anim */
@keyframes flip { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
.flip { animation: flip .35s ease-out both; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.rise { animation: rise .3s ease-out both; }
@media (prefers-reduced-motion: reduce) { .flip, .rise { animation: none; } .hand .card { transition: none; } .sparks { display: none; } }

@media (max-width: 640px) {
  .stage { --sw: 78px; width: 100cqw; height: 100cqh; }
  .hand { --hw: clamp(44px, min(15vw, 9dvh), 64px); flex-wrap: wrap; gap: 12px 6px; }
  .hand .card { width: min(var(--hw), calc((100% - (var(--rn) - 1) * 6px) / var(--rn))); }
  .hand .card + .card { margin-left: 0; }
  header .meta { display: none; }
  .stage-box { min-height: 200px; }
  .board { inset: 10% 9%; }
  .mat .card.big { --w: clamp(56px, 19cqh, 92px); }
  .pile { --w: clamp(26px, 7cqh, 30px); font-size: 11px; }
  .mark { font-size: 30px; } .mark svg { width: 20px; height: 20px; }
  .pl-s { white-space: normal; text-align: center; max-width: 10ch; }
  .mat { grid-template-columns: auto auto; grid-template-areas: "draw tcol" "disc tcol"; row-gap: 8px; }
  .plaque .nm { font-size: 14px; }
  .splash-top { grid-template-columns: 1fr; }
  .fan { margin: 0 auto; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="engine.js"></script>
<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const BOTS = ['Ana', 'Ben', 'Cora', 'Dev', 'Edda', 'Finn', 'Gus'];
const STYLE_LABEL = { bold: 'plays to win', shedder: 'dumps cards', steady: 'balanced', human: 'player' };
const rng = Math.random;
const neg = v => v < 0 ? '−' + (-v) : String(v);
const QUENCH_IMG = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
<defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd0ea"/><stop offset="1" stop-color="#1f6f8f"/></linearGradient></defs>
<rect x="0" y="0" width="250" height="350" rx="16" fill="#f4ead8"/><rect x="10" y="10" width="230" height="330" rx="10" fill="none" stroke="#2e86ab" stroke-width="5"/>
<g fill="none" stroke="#2e86ab" stroke-width="5" stroke-linecap="round" opacity=".55"><path d="M95 92c-10-14 10-22 0-36"/><path d="M125 86c-10-14 10-22 0-36"/><path d="M155 92c-10-14 10-22 0-36"/></g>
<path d="M70 130h110l-12 120a14 14 0 0 1-14 12h-58a14 14 0 0 1-14-12z" fill="#3b3e43" stroke="#1d1f22" stroke-width="4"/>
<path d="M76 146h98l-2 22H78z" fill="url(#w)"/><path d="M62 130h126" stroke="#8a8f96" stroke-width="10" stroke-linecap="round"/>
<path d="M78 128c0-34 94-34 94 0" fill="none" stroke="#8a8f96" stroke-width="6"/>
<text x="125" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="5" fill="#2e86ab" font-weight="700">QUENCH</text>
<text x="26" y="58" font-family="Georgia, serif" font-size="46" fill="#2e86ab" font-weight="700">0</text>
</svg>`);
const src = c => c.suit === 'quench' ? QUENCH_IMG : 'cards/' + c.suit + '_' + c.value + '.webp';
const suitIdx = s => s === 'black' ? 9 : SUIT_ORDER.indexOf(s);
const sortHand = h => h.slice().sort((a, b) => a.value - b.value || suitIdx(a.suit) - suitIdx(b.suit) || (b.star - a.star));

let S = { phase: 'splash', bots: 3, mode: 'deals', colorRule: false, match: null, G: null, sel: [], last: null, newIds: [], msg: '', showRules: false };

function cardEl(c, cls = '', extra = '') {
  return `<span class="card ${cls}" ${extra}><img src="${src(c)}" alt="${cardLabel(c)}">${badges(c, cls.includes('mini'), false)}</span>`;
}
function badges(c, mini, paired) {
  let s = c.star ? '<span class="star" aria-hidden="true">★</span>' : '';
  if (c.value < 0) {
    s += `<span class="negmark" aria-hidden="true">${neg(c.value)}</span>`;
    if (!mini) s += paired ? '<span class="fivemark paired" title="Paired with a same-suit card: subtracts at scoring">paired</span>' : `<span class="fivemark" title="Scores +5 at the end unless paired with a same-suit card${c.suit === 'black' ? ' (black never pairs)' : ''}">+5</span>`;
  }
  return s;
}
function backEl(cls = '') { return `<span class="card ${cls}"><img src="cards/back.webp" alt="Face-down card"></span>`; }
const hammerSvg = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h10.5l3 2.5v3.5H4z M9 10.5h3.4V22H9z" fill="currentColor"/></svg>`;
// sparks drifting up from the forge
(() => { const box = document.createElement('div'); box.className = 'sparks'; box.setAttribute('aria-hidden', 'true');
  box.innerHTML = Array.from({ length: 16 }, () => `<i style="left:${(Math.random() * 100).toFixed(1)}%;--d:${(5 + Math.random() * 6).toFixed(1)}s;--dl:${(-Math.random() * 10).toFixed(1)}s;--dx:${(Math.random() * 80 - 40).toFixed(0)}px"></i>`).join('');
  document.body.prepend(box); })();

// ===== flow =====
function startMatch() {
  RULES.colorCount = S.colorRule; RULES.quench = !!S.quench;
  const names = ['You', ...BOTS.slice(0, S.bots)];
  const styles = names.map((_, i) => i === 0 ? null : STYLES[(i - 1) % 3]);
  S.match = { names, styles, totals: names.map(() => 0), deals: [], mode: S.mode };
  startDeal();
}
function startDeal() {
  S.G = newDeal(S.match.names, rng); delete S.G.rng;
  S.sel = []; S.last = null; S.newIds = [];
  S.phase = 'choose';
  S.msg = `Deal ${S.match.deals.length + 1}. Pick up to 3 cards that add up to the target.`;
  render();
}
function myHand() { return S.G.players[0].hand; }
function commit(play) {
  if (S.online) { S.confirmPass = false; onlineSend({ t: 'play', ids: play ? play.map(c => c.id) : null }); return; }
  const G = S.G, t = G.target;
  const plays = G.players.map((p, i) => i === 0 ? play : botMove(G, i, S.match.styles[i], rng));
  const before = G.players.map(p => p.hand.length);
  const res = resolveRound(G, plays);
  S.last = res; S.sel = [];
  S.newIds = res.penalties.filter(p => p.i === 0).map(p => p.card.id);
  S.phase = 'reveal';
  const t2 = res.target;
  if (res.reflip) S.msg = `Nobody made ${t2.value}. In a 2-player game the first miss flips a new target.`;
  else if (res.quenched && !res.ended) S.msg = `<b>Quenched!</b> ${quenchNames(res.quenchedBy, G.players)} doused the round. Nobody wins, and a new target is flipped.`;
  else if (res.ended) S.msg = G.endReason;
  else {
    const w = G.players[res.winner].name;
    S.msg = `<b>${w === 'You' ? 'You win' : w + ' wins'}</b> the round: ${res.reason}.`;
    if (res.winner === 0 && myHand().some(c => c.value > 0)) {
      S.phase = 'pick'; S.pickSel = null;
      S.msg = `<b>You win</b> the round: ${res.reason}. Now pick the next target from your hand.`;
    }
  }
  render();
}
function quenchNames(idx, players) { const n = idx.map(i => players[i].name); return n.length > 1 ? n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1] : n[0]; }
function afterReveal() {
  if (S.online) { onlineSend({ t: 'ready' }); return; }
  const G = S.G, res = S.last;
  if (G.over) return endDeal();
  if (res.reflip || res.quenched) { S.phase = 'choose'; S.last = null; S.msg = `New target flipped. Make ${G.target.value}.`; return render(); }
  if (res.winner === 0) {
    if (!myHand().some(c => c.value > 0)) { setNextTarget(G, 0, null); return toChoose(`You hold only negatives, so the target was flipped from the draw pile.`); }
    S.phase = 'pick'; S.msg = `<b>You won.</b> Tap a card from your hand to set the next target.`;
    return render();
  }
  const w = res.winner, card = botTarget(G.players[w].hand, rng, botCtx(G, w));
  setNextTarget(G, w, card);
  if (G.over) return endDeal();
  toChoose(card ? `${G.players[w].name} set the next target: ${cardLabel(card)}.` : `${G.players[w].name} holds only negatives, so the target was flipped.`);
}
function toChoose(msg) { S.phase = 'choose'; S.last = null; S.msg = msg; render(); }
function pickTarget(card) {
  if (S.online) { onlineSend({ t: 'target', id: card.id }); return; }
  setNextTarget(S.G, 0, card);
  if (S.G.over) return endDeal();
  S.newIds = [];
  toChoose(`You set the target: ${cardLabel(card)}.`);
}
function endDeal() {
  const G = S.G, M = S.match;
  const scores = G.players.map(p => scoreHand(p.hand));
  scores.forEach((s, i) => { M.totals[i] += s.total; });
  M.deals.push(scores.map(s => s.total));
  const done = M.mode === 'deals' ? M.deals.length >= 3 : M.totals.some(t => t >= 50);
  S.dealScores = scores; S.phase = done ? 'matchEnd' : 'dealEnd';
  render();
}

// ===== render =====
function render() {
  const app = $('#app');
  if (S.phase === 'splash') { app.classList.remove('fit'); app.innerHTML = splash(); bindSplash(); return; }
  if (S.phase === 'lobby' && S.online && S.online.view) { app.classList.remove('fit'); app.innerHTML = lobbyHtml(); bindLobby(); return; }
  app.classList.add('fit');
  app.innerHTML = header() + `<div class="stage-box">${tableHtml()}${showdownHtml()}</div>` + `<p class="herald" role="status">${S.msg}</p>` + you() + overlay();
  bindTable();
}
function header() {
  const M = S.match, G = S.G;
  const dealN = M.deals.length + (S.phase === 'dealEnd' || S.phase === 'matchEnd' ? 0 : 1);
  const goal = M.mode === 'deals' ? `Deal ${Math.min(dealN, 3)} of 3` : `Deal ${dealN} · play to 50`;
  return `<header><div class="mark">${hammerSvg}Slag</div>
    <div class="meta">${S.online ? `Room ${S.online.view.code} · ` : ''}${goal} · Round ${G.round}</div>
    <div class="hdr-btns"><button class="btn small" id="b-rules">Rules</button><button class="btn small" id="b-quit">${S.online ? 'Leave' : 'New game'}</button></div></header>`;
}

// rivets around the iron band, placed once
const RIVETS = Array.from({ length: 30 }, (_, i) => {
  const a = i / 30 * Math.PI * 2;
  return `<span class="rivet" style="left:calc(50% + (50% + 5px) * ${Math.cos(a).toFixed(4)});top:calc(50% - (50% + 5px) * ${Math.sin(a).toFixed(4)})"></span>`;
}).join('');

const narrow = () => window.matchMedia('(max-width: 640px)').matches;
let _rz; window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { if (S.phase !== 'splash') render(); }, 150); });
// opponents spread over the far side of the table; more players wrap down the sides
function seatAngles(n) {
  if (n === 1) return [90];
  const [a, b] = n <= 3 ? [158, 22] : narrow() ? [215, -35] : [208, -28];
  return Array.from({ length: n }, (_, k) => a + (b - a) * k / (n - 1));
}
function seatHtml(i, deg) {
  const G = S.G, res = S.last, M = S.match, p = G.players[i];
  const r = deg * Math.PI / 180, sin = Math.sin(r), cos = Math.cos(r);
  const [rx, ry] = narrow() ? [41, 40] : [41.5, 37.5];
  const x = 50 + rx * cos, y = 50 - ry * sin;
  const showing = (S.phase === 'reveal' || S.phase === 'pick') && res;
  const play = showing ? res.plays[i] : null;
  const won = showing && res.winner === i;
  const drew = showing && res.penalties.some(q => q.i === i);
  let cards = '';
  const tags = [];
  if (showing) {
    if (play) cards = play.map((c, j) => cardEl(c, 'mini flip', `style="animation-delay:${80 * j + 70 * i}ms"`)).join('');
    else tags.push('<span class="tag">passed</span>');
    if (won) tags.push('<span class="tag win">won the round</span>');
    if (drew) tags.push('<span class="tag drew">drew 1</span>');
  } else if (S.phase === 'choose' && i !== 0) {
    const ov = S.online && S.online.view;
    if (ov && ov.away[i]) tags.push('<span class="tag drew">away · bot playing</span>');
    else if (ov && ov.ready[i]) tags.push('<span class="tag">locked in</span>');
    else tags.push('<span class="tag dim">thinking…</span>');
  }
  const title = i === 0 ? 'Your seat' : STYLE_LABEL[M.styles[i]];
  // close to going out: 3 or fewer cards
  const left = p.hand.length, low = left > 0 && left <= 3;
  const lowBadge = low ? `<span class="low-badge ${left === 1 ? 'last' : ''}">${left === 1 ? 'Last card!' : left + ' left'}</span>` : '';
  return `<div class="seat ${sin < -0.05 ? 'below' : ''} ${won ? 'win' : ''} ${i === 0 ? 'me' : ''} ${low ? 'low' : ''} ${left === 1 ? 'last' : ''}"
      style="left:clamp(calc(var(--sw) / 2), ${x.toFixed(2)}%, calc(100% - var(--sw) / 2));top:clamp(34px, ${y.toFixed(2)}%, calc(100% - 34px))">

function meterText() {

  const sum = sel.reduce((s, c) => s + c.value, 0);

  if (sel.filter(c => c.value < 0).length > 1) return `${expr} <span class="no">· only one negative per play</span>`;

  const stb = $('#b-settarget'); if (stb) stb.onclick = () => { const c = myHand().find(x => x.id === S.pickSel); if (c) { S.pickSel = null; pickTarget(c); } };
  const d = $('#b-deal'); if (d) d.onclick = () => S.online ? onlineSend({ t: 'next' }) : startDeal();
  const a = $('#b-again'); if (a) a.onclick = () => S.online ? onlineSend({ t: 'next' }) : startMatch();
  const st = $('#b-setup'); if (st) st.onclick = () => { if (S.online) return onlineSend({ t: 'lobby' }); S.phase = 'splash'; render(); };
}

// ===== online play =====
// The server runs hosted games. Each player's view arrives already turned so that they sit at seat 0,
// which lets the same table code draw single-player and online games.
const ONLINE_HOST = 'slag-online.onrender.com'; // the web service that hosts games, used when this page is opened from elsewhere
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function wsUrl() {
  const local = location.protocol.startsWith('http') && !/slag-in1n\.onrender\.com$/.test(location.hostname);
  const host = local ? location.host : ONLINE_HOST;
  return (location.protocol === 'http:' && local ? 'ws://' : 'wss://') + host + '/ws';
}
function getSession() { try { return JSON.parse(localStorage.getItem('slag-online') || 'null'); } catch (e) { return null; } }
function setSession(v) { try { v ? localStorage.setItem('slag-online', JSON.stringify(v)) : localStorage.removeItem('slag-online'); } catch (e) {} }
function onlineSend(msg) { const o = S.online; if (o && o.ws && o.ws.readyState === 1) o.ws.send(JSON.stringify(msg)); }

function goOnline(first, connecting) {
  if (S.online && S.online.ws) { S.online.leaving = true; try { S.online.ws.close(); } catch (e) {} }
  let ws;
  try { ws = new WebSocket(wsUrl()); } catch (e) { return onlineFail('Online play is not available from this page.'); }
  const o = S.online = { ws, view: null, lost: false, leaving: false, tries: (S.online && S.online.tries) || 0 };
  S.oerr = '';
  if (connecting) {
    S.quietRejoin = false;
    // show progress right away; the free server can take a while to wake up
    S.connecting = { label: connecting, since: Date.now(), slow: false };
    clearTimeout(S.slowTimer);
    S.slowTimer = setTimeout(() => { if (S.connecting) { S.connecting.slow = true; render(); } }, 5000);
    render();
  }
  ws.onopen = () => { o.tries = 0; o.lost = false; first(); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onlineMessage(m); };
  ws.onclose = () => {
    if (S.online !== o || o.leaving) return;
    const sess = getSession();
    if (!sess || o.tries >= 8) return onlineFail(S.connecting ? "Couldn't reach the game server. Check your connection and try again." : 'Lost the connection to the game.');
    o.lost = true; o.tries++;
    if (S.phase !== 'splash') render();
    setTimeout(() => { if (S.online === o) goOnline(() => onlineSend({ t: 'join', code: sess.code, token: sess.token, rejoinOnly: true })); }, 1500 * o.tries);
  };
}
function stopConnecting() { S.connecting = null; clearTimeout(S.slowTimer); }
function cancelConnecting() {
  if (S.online) { S.online.leaving = true; try { S.online.ws.close(); } catch (e) {} }
  S.online = null; stopConnecting(); render();
}
function onlineFail(msg) {
  if (S.online) { S.online.leaving = true; try { S.online.ws.close(); } catch (e) {} }
  S.online = null; setSession(null); stopConnecting();
  S.oerr = S.quietRejoin ? '' : msg; S.quietRejoin = false;
  S.phase = 'splash'; S.G = null; S.match = null; S.confirmQuit = false;
  render();
}
function onlineMessage(m) {
  if (m.t === 'joined') {
    setSession({ code: m.code, token: m.token, name: m.name });
    S.quietRejoin = false; S.joinCode = '';
    try { if (location.search) history.replaceState(null, '', location.pathname); } catch (e) {}
    return;
  }
  if (m.t === 'kicked') return onlineFail(m.msg);
  if (m.t === 'error') {
    if (m.fatal) return onlineFail(m.msg);
    S.msg = esc(m.msg); render(); return;
  }
  if (m.t === 'state') { stopConnecting(); applyView(m); }
}
function applyView(v) {
  const o = S.online; if (!o) return;
  o.view = v; o.lost = false;
  RULES.colorCount = v.settings.colorRule;
  RULES.quench = !!v.settings.quench;
  if (v.phase === 'lobby') { S.phase = 'lobby'; S.G = null; S.match = null; S.last = null; S.confirmQuit = false; return render(); }
  const prevPhase = S.phase, prevRound = S.G ? S.G.round : 0;
  S.G = v.G; S.match = v.match; S.last = v.last; S.dealScores = v.dealScores; S.msg = v.msg;
  if (v.phase !== prevPhase || v.G.round !== prevRound) { S.sel = []; S.pickSel = null; S.confirmPass = false; }
  if (v.last) S.newIds = v.last.penalties.filter(q => q.i === 0 && q.card).map(q => q.card.id);
  else if (v.G.round === 1) S.newIds = [];
  S.newIds = S.newIds.filter(id => myHand().some(c => c.id === id));
  S.phase = v.phase;
  render();
}
function leaveOnline() {
  onlineSend({ t: 'leave' });
  if (S.online) { S.online.leaving = true; try { S.online.ws.close(); } catch (e) {} }
  S.online = null; setSession(null);
  S.phase = 'splash'; S.G = null; S.match = null; S.confirmQuit = false;
  render();
}
function onlineSection() {
  const code = (S.joinCode || '').toUpperCase(), inviting = code.length === 4;
  return `<div class="panel mode friends"><h2 class="ph">Play with friends</h2>
      ${inviting ? `<p class="invite">You're invited to room <b>${esc(code)}</b>. Enter your name to take a seat.</p>` : '<p class="hint">Host a room and share the code, or join a friend\'s room. Empty seats can be filled with bots.</p>'}
      <div class="name-row"><label class="lbl" for="o-name">Your name</label>
        <input id="o-name" class="inp" maxlength="16" autocomplete="nickname" placeholder="Your name" value="${esc(S.oname || '')}"></div>
      ${inviting
        ? `<div class="actions"><button class="btn primary" id="b-join">Join room ${esc(code)}</button><button class="btn small" id="b-notinvite">Host my own game</button></div>`
        : `<div class="actions"><button class="btn primary" id="b-host">Host a game</button></div>
           <div class="actions join-row"><label class="hint" for="o-code">Have a code?</label>
             <input id="o-code" class="inp code" maxlength="4" autocomplete="off" placeholder="CODE" value="${esc(code)}">
             <button class="btn" id="b-join">Join</button></div>`}
      ${S.oerr ? `<span class="hint bad" role="alert">${esc(S.oerr)}</span>` : ''}
    </div>`;
}
function connectingHtml() {
  const c = S.connecting; if (!c) return '';
  return `<div class="sheet-bg"><div class="sheet connecting" role="dialog" aria-modal="true" aria-labelledby="conn-h">
      <div class="anvil" aria-hidden="true"><span></span><span></span><span></span></div>
      <h2 id="conn-h">${esc(c.label)}</h2>
      <p class="hint" role="status">${c.slow ? 'The game server is waking up. The first game after a quiet spell can take up to a minute; it’s quick after that.' : 'Connecting to the game server…'}</p>
      <div class="actions"><button class="btn" id="b-conn-cancel">Cancel</button></div></div></div>`;
}
function bindOnlineSection() {
  const nm = $('#o-name'), cd = $('#o-code');
  const cc = $('#b-conn-cancel'); if (cc) cc.onclick = cancelConnecting;
  if (!nm) return;
  nm.oninput = () => { S.oname = nm.value; save(); };
  if (cd) cd.oninput = () => { cd.value = cd.value.toUpperCase().replace(/[^A-Z]/g, ''); };
  const need = () => { const name = nm.value.trim(); if (!name) { S.oerr = 'Enter your name first.'; render(); const f = $('#o-name'); if (f) f.focus(); return null; } return name; };
  const host = () => { if (S.connecting) return; const name = need(); if (!name) return; goOnline(() => onlineSend({ t: 'create', name }), 'Opening a room…'); };
  const join = () => {
    if (S.connecting) return;
    const name = need(); if (!name) return;
    const code = (cd ? cd.value : S.joinCode || '').trim().toUpperCase();
    if (code.length !== 4) { S.oerr = 'Enter the 4-letter code from your host.'; render(); const f = $('#o-code'); if (f) f.focus(); return; }
    goOnline(() => onlineSend({ t: 'join', code, name }), `Joining room ${code}…`);
  };
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  on('#b-host', host); on('#b-join', join);
  on('#b-notinvite', () => { S.joinCode = ''; S.oerr = ''; try { history.replaceState(null, '', location.pathname); } catch (e) {} render(); });
  nm.onkeydown = e => { if (e.key === 'Enter') (S.joinCode ? join : host)(); };
  if (cd) cd.onkeydown = e => { if (e.key === 'Enter') join(); };
}
function lobbyHtml() {
  const v = S.online.view, host = v.host, n = v.seats.length;
  const link = `${location.origin}${location.pathname}?join=${v.code}`;
  const rows = v.seats.map((s, i) => `<li class="pl ${s.you ? 'me' : ''}">
      <span class="pl-name">${esc(s.name)}${s.you ? ' <span class="tag">you</span>' : ''}${s.host ? ' <span class="tag win">host</span>' : ''}${s.bot ? ` <span class="tag">bot · ${STYLE_LABEL[s.style]}</span>` : ''}${!s.connected ? ' <span class="tag drew">away</span>' : ''}</span>
      ${host && !s.you ? `<button class="btn small" data-remove="${i}" aria-label="Remove ${esc(s.name)}">Remove</button>` : ''}</li>`).join('');
  const waiting = Array.from({ length: n < 2 ? 1 : 0 }, () => '<li class="pl open"><span class="pl-name">Waiting for a friend…</span></li>').join('');
  const seg = (k, opts, cur) => `<div class="seg" role="group">${opts.map(([val, label]) => `<button data-${k}="${val}" aria-pressed="${cur === val}" ${host ? '' : 'disabled'}>${label}</button>`).join('')}</div>`;
  const canShare = typeof navigator.share === 'function';
  const deal = host
    ? `<button class="btn primary big" id="b-ostart" ${n < 2 ? 'disabled' : ''}>Deal the cards</button><span class="hint">${n < 2 ? 'Share the code, or add a bot to play right away.' : `${n} players at the table.`}</span>`
    : '<span class="hint">Waiting for the host to deal…</span>';
  return `<section class="lobby">
    <header><div class="mark">${hammerSvg}Slag</div><div class="hdr-btns"><button class="btn small" id="b-rules">Rules</button><button class="btn small" id="b-leave">Leave</button></div></header>
    <div class="lobby-grid">
      <div class="panel code-panel"><span class="eyebrow">Room code</span><span class="code-big">${v.code}</span>
        <div class="actions">${canShare ? '<button class="btn" id="b-share">Share invite</button>' : ''}<button class="btn" id="b-copy">Copy invite link</button><span class="hint" id="copy-ok" role="status"></span></div>
        <span class="hint">Friends open the link, or enter <b>${v.code}</b> on the start screen.</span>
        <div class="actions deal-row">${deal}</div></div>
      <div class="panel"><h2 class="ph">Players <span class="meta">${n} of 8</span></h2><ul class="plist">${rows}${waiting}</ul>
        ${host ? `<div class="actions"><button class="btn small" id="b-addbot" ${n >= 8 ? 'disabled' : ''}>Add a bot</button></div>` : ''}</div>
      <div class="panel rules-panel"><h2 class="ph">Rules</h2>
        <div class="field"><span class="lbl">Match</span>${seg('mode', [['deals', 'Three deals'], ['fifty', 'Play to 50']], v.settings.mode)}</div>
        <div class="field"><span class="lbl">Who wins a round</span>${seg('rule', [['high', 'Highest card'], ['count', 'Most of the color']], v.settings.colorRule ? 'count' : 'high')}</div>
        <div class="field"><span class="lbl">Quench cards</span>${seg('quench', [['off', 'Off'], ['on', 'On']], v.settings.quench ? 'on' : 'off')}${v.settings.quench ? `<span class="hint">${quenchCount(Math.max(n, 2))} in the deck for ${n} player${n > 1 ? 's' : ''}.</span>` : ''}</div>
        ${host ? '' : '<span class="hint">The host sets the rules.</span>'}</div>
    </div>
  </section>${overlay()}`;
}
function bindLobby() {
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  const link = () => `${location.origin}${location.pathname}?join=${S.online.view.code}`;
  on('#b-rules', () => { S.showRules = true; render(); });
  on('#b-leave', leaveOnline);
  on('#b-addbot', () => onlineSend({ t: 'addBot' }));
  on('#b-ostart', () => onlineSend({ t: 'start' }));
  on('#b-share', () => { try { navigator.share({ title: 'Play Slag with me', text: `Join my Slag game. Room code ${S.online.view.code}.`, url: link() }).catch(() => {}); } catch (e) {} });
  on('#b-copy', () => {
    const ok = $('#copy-ok'), done = t => { if (ok) ok.textContent = t; };
    try { navigator.clipboard.writeText(link()).then(() => done('Copied. Paste it to your friends.'), () => done(link())); } catch (e) { done(link()); }
  });
  document.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => onlineSend({ t: 'remove', seat: +b.dataset.remove }));
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => onlineSend({ t: 'settings', mode: b.dataset.mode }));
  document.querySelectorAll('[data-rule]').forEach(b => b.onclick = () => onlineSend({ t: 'settings', colorRule: b.dataset.rule === 'count' }));
  document.querySelectorAll('[data-quench]').forEach(b => b.onclick = () => onlineSend({ t: 'settings', quench: b.dataset.quench === 'on' }));
  bindOverlay();
}

// remember setup choices for this viewer only
function save() { try { localStorage.setItem('slag-setup', JSON.stringify({ bots: S.bots, mode: S.mode, colorRule: S.colorRule, ruleChosen: !!S.ruleChosen, quench: !!S.quench, oname: S.oname || '' })); } catch (e) {} }
function load() { try { const v = JSON.parse(localStorage.getItem('slag-setup') || 'null'); if (v) { S.bots = v.bots || 3; S.mode = v.mode || 'deals'; if (v.ruleChosen && typeof v.colorRule === 'boolean') { S.colorRule = v.colorRule; S.ruleChosen = true; } S.quench = !!v.quench; if (v.oname) S.oname = v.oname; } } catch (e) {} }

// keep a game in progress across page updates
const hot = window.claude && window.claude.hot;
function start(data) {
  load();
  if (data && data.S && data.S.phase) S = data.S;
  if (typeof S.colorRule !== 'boolean') S.colorRule = false;
  RULES.colorCount = S.colorRule;
  RULES.quench = !!S.quench;
  const q = new URLSearchParams(location.search).get('join');
  if (q) S.joinCode = q.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  // wake the game server now, so hosting or joining is quick when the player gets there
  try { if (location.host !== ONLINE_HOST) fetch('https://' + ONLINE_HOST + '/healthz', { mode: 'no-cors', cache: 'no-store' }).catch(() => {}); } catch (e) {}
  render();
  const sess = getSession();
  if (sess && !S.online && (!S.joinCode || S.joinCode === sess.code)) {
    S.quietRejoin = true;
    goOnline(() => onlineSend({ t: 'join', code: sess.code, token: sess.token, name: sess.name, rejoinOnly: true }));
  } else if (S.joinCode && S.joinCode.length === 4 && (S.oname || '').trim()) {
    const code = S.joinCode, name = S.oname.trim();
    goOnline(() => onlineSend({ t: 'join', code, name }), `Joining room ${code}…`);
  } else if (S.joinCode) { const f = $('#o-name'); if (f) f.focus(); }
}
try { if (hot && hot.snapshot) hot.snapshot(() => ({ S })); } catch (e) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
